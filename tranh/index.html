<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Chuyển dữ liệu</title>
<style>
:root{--bg:#f7f3fa;--panel:#fff;--fg:#2e2a3b;--muted:#6c6680;--line:#e8e1f0;--accent:#f4b3cb;--accent-ink:#4a2234;--ok:#2f7f55;--err:#b0435a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1d1b25;--panel:#26232f;--fg:#ece8f4;--muted:#a8a1ba;--line:#3a3548;--ok:#93d8b0;--err:#f3a2b1;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1d1b25;--panel:#26232f;--fg:#ece8f4;--muted:#a8a1ba;--line:#3a3548;--ok:#93d8b0;--err:#f3a2b1;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,"Segoe UI",sans-serif;padding:16px;display:flex;justify-content:center}
main{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;max-width:560px;width:100%;margin-top:6vh}
h1{margin:0 0 8px;font-size:22px}
p{color:var(--muted);margin:8px 0}
button{font:inherit;font-weight:600;background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:10px 16px;cursor:pointer;margin-top:10px}
#out{margin-top:12px;font-weight:600}
.ok{color:var(--ok)}.err{color:var(--err)}
</style>
</head>
<body>
<main>
  <h1>App đã chuyển sang máy chủ công ty</h1>
  <p>Trang này không còn dùng để làm việc. App <b>Quản lý đơn hàng</b> giờ chạy trên máy chủ trong mạng LAN của công ty, mở bằng link nội bộ.</p>
  <p>Nếu máy này từng nhập dữ liệu ở trang cũ, bấm nút dưới để tải dữ liệu về, rồi vào app trên máy chủ: <b>Cài đặt → Nạp dữ liệu bản cũ</b>.</p>
  <button id="go">Xuất dữ liệu của máy này</button>
  <div id="out"></div>
</main>
<script>
/* đọc dữ liệu app cũ lưu trong trình duyệt (IndexedDB 'layfilein') và tải về một file JSON; bỏ quyền thư mục và ảnh xem trước tạm */
const out = document.getElementById('out');
const toUrl = b => new Promise(ok => { const r = new FileReader(); r.onload = () => ok(r.result); r.readAsDataURL(b); });
document.getElementById('go').addEventListener('click', async () => {
  out.className = ''; out.textContent = 'Đang đọc dữ liệu…';
  try {
    const db = await new Promise((ok, no) => { const r = indexedDB.open('layfilein', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error); });
    const st = db.transaction('kv').objectStore('kv');
    const keys = await new Promise(ok => { const q = st.getAllKeys(); q.onsuccess = () => ok(q.result); q.onerror = () => ok([]); });
    const get = k => new Promise(ok => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => ok(q.result); q.onerror = () => ok(undefined); });
    const kv = {}, imgs = {};
    for (const k of keys) {
      if (/^(srcDir|dstDir|catDirs)$/.test(k) || String(k).startsWith('th:')) continue;
      const v = await get(k);
      if (String(k).startsWith('img:')) { if (v instanceof Blob) imgs[k.slice(4)] = await toUrl(v); continue; }
      kv[k] = v;
    }
    const n = (kv.orders || []).length + (kv.records || []).length + (kv.le || []).length + Object.keys(imgs).length;
    if (!n && !kv.cat) { out.className = 'err'; out.textContent = 'Máy này không có dữ liệu của app cũ.'; return; }
    const blob = new Blob([JSON.stringify({ from: 'github', at: new Date().toISOString(), kv, imgs })], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = `du-lieu-quan-ly-don-${new Date().toISOString().slice(0, 10)}.json`; a.click();
    out.className = 'ok';
    out.textContent = `Đã tải file: ${(kv.orders || []).length} dòng đơn, ${(kv.records || []).length} dòng thống kê, ${(kv.le || []).length} đơn lẻ, ${Object.keys(imgs).length} ảnh.`;
  } catch (e) { out.className = 'err'; out.textContent = 'Không đọc được dữ liệu: ' + e.message; }
});
</script>
</body>
</html>
